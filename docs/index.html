<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LingoStacks — Voice-First Vocabulary &amp; Flashcard App for Android</title>
  <meta name="description" content="Practice 8,270+ words and phrases in English, Spanish, German, French, and Italian out loud with real-time speech recognition, swipe flashcards, and smart spaced repetition." />
  <meta name="keywords" content="LingoStacks, Android vocabulary app, language learning, flashcards, speech recognition, spaced repetition, English, Spanish, German, French, Italian" />
  <link rel="canonical" href="https://radekvlk.github.io/LingoStacks/" />

  <!-- Open Graph / Social Share Preview -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://radekvlk.github.io/LingoStacks/" />
  <meta property="og:title" content="LingoStacks — Learn Words Out Loud on Android" />
  <meta property="og:description" content="Voice-first flashcards &amp; spaced repetition for 5 languages (EN, ES, DE, FR, IT). Free, no ads, with Google cloud backup &amp; daily leaderboard." />
  <meta property="og:image" content="https://radekvlk.github.io/LingoStacks/screenshots/01_home.png" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="LingoStacks — Learn Words Out Loud on Android" />
  <meta name="twitter:description" content="Voice-first flashcards &amp; spaced repetition for 5 languages. Free &amp; ad-free Android APK." />
  <meta name="twitter:image" content="https://radekvlk.github.io/LingoStacks/screenshots/01_home.png" />

  <style>
    :root {
      --bg: #f3f5f9;
      --surface: rgba(255, 255, 255, 0.82);
      --border: rgba(255, 255, 255, 0.9);
      --shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
      --text: #111827;
      --muted: #4b5563;
      --blue: #0a84ff;
      --indigo: #5856d6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 10%, rgba(10, 132, 255, 0.14), transparent 38%),
        radial-gradient(circle at 85% 20%, rgba(88, 86, 214, 0.14), transparent 36%),
        var(--bg);
      line-height: 1.55;
    }
    .wrap {
      max-width: 1060px;
      margin: 0 auto;
      padding: 20px 20px 64px;
    }
    .topbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 14px;
    }
    .lang-switch {
      display: inline-flex;
      background: var(--surface);
      border: 1px solid rgba(17, 24, 39, 0.08);
      border-radius: 999px;
      padding: 4px;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.05);
    }
    .lang-btn {
      border: 0;
      background: transparent;
      padding: 6px 14px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      color: var(--muted);
    }
    .lang-btn.active {
      background: #fff;
      color: var(--text);
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
    }
    .hero {
      display: grid;
      grid-template-columns: 1.35fr 0.65fr;
      gap: 28px;
      align-items: center;
      background: var(--surface);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 36px;
      box-shadow: var(--shadow);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }
    .brand-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.15;
      letter-spacing: -0.03em;
    }
    .lead {
      margin: 0 0 24px;
      font-size: 17px;
      color: var(--muted);
    }
    .cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 22px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 16px;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary {
      color: #fff;
      background: linear-gradient(135deg, var(--blue), var(--indigo));
      box-shadow: 0 10px 24px rgba(10, 132, 255, 0.28);
    }
    .btn-secondary {
      color: var(--text);
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(17, 24, 39, 0.1);
    }
    .qr-card {
      text-align: center;
      background: #fff;
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 10px 26px rgba(15, 23, 42, 0.06);
      border: 1px solid rgba(17, 24, 39, 0.06);
    }
    .qr-card img {
      width: 168px;
      height: 168px;
      display: block;
      margin: 0 auto 10px;
    }
    .qr-card small {
      display: block;
      color: var(--muted);
      font-size: 13px;
    }
    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
    }
    .pill {
      font-size: 13px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(10, 132, 255, 0.09);
      color: #0b57d0;
    }
    h2 {
      margin: 44px 0 18px;
      font-size: 24px;
      letter-spacing: -0.02em;
    }
    .shots {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 14px;
    }
    .shot {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 8px;
      box-shadow: var(--shadow);
    }
    .shot img {
      width: 100%;
      border-radius: 14px;
      display: block;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 22px;
      box-shadow: var(--shadow);
    }
    .card h3 {
      margin: 0 0 8px;
      font-size: 17px;
    }
    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 14.5px;
    }
    .install-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 24px 28px;
      box-shadow: var(--shadow);
    }
    .install-box ol {
      margin: 10px 0 0;
      padding-left: 20px;
      color: var(--muted);
    }
    .install-box li { margin-bottom: 8px; }
    footer {
      margin-top: 48px;
      text-align: center;
      color: var(--muted);
      font-size: 13.5px;
    }
    footer a { color: var(--blue); text-decoration: none; }
    @media (max-width: 860px) {
      .hero { grid-template-columns: 1fr; padding: 24px; }
      .shots { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="lang-switch" role="group" aria-label="Language switch">
        <button class="lang-btn" id="btn-cs" onclick="setLang('cs')">🇨🇿 Čeština</button>
        <button class="lang-btn" id="btn-en" onclick="setLang('en')">🇬🇧 English</button>
      </div>
    </div>

    <section class="hero">
      <div>
        <div class="brand">
          <svg width="42" height="42" viewBox="0 0 42 42" fill="none" aria-hidden="true">
            <rect x="4" y="6" width="22" height="30" rx="6" transform="rotate(-12 15 21)" fill="url(#g1)" opacity="0.45"/>
            <rect x="13" y="6" width="22" height="30" rx="6" fill="#FFFFFF" stroke="#5856D6" stroke-width="1.6"/>
            <path d="M24 14L25.8 19.2L31 21L25.8 22.8L24 28L22.2 22.8L17 21L22.2 19.2L24 14Z" fill="#0A84FF"/>
            <defs>
              <linearGradient id="g1" x1="4" y1="6" x2="26" y2="36" gradientUnits="userSpaceOnUse">
                <stop stop-color="#0A84FF"/>
                <stop offset="1" stop-color="#5856D6"/>
              </linearGradient>
            </defs>
          </svg>
          <span class="brand-title">LingoStacks</span>
        </div>

        <h1 data-cs="Učte se slovíčka nahlas,<br/>ne jen očima."
            data-en="Learn vocabulary out loud,<br/>not just with your eyes."></h1>

        <p class="lead"
           data-cs="Hlasové procvičování, plynulé swipe kartičky a chytré opakování (SRS) pro <strong>angličtinu, španělštinu, němčinu, francouzštinu a italštinu</strong>. Zdarma, bez reklam a s automatickou zálohou přes Google účet."
           data-en="Voice-first practice, smooth swipe flashcards, and smart spaced repetition (SRS) for <strong>English, Spanish, German, French, and Italian</strong>. Free, ad-free, with automatic Google cloud backup."></p>

        <div class="cta-row">
          <a class="btn btn-primary" href="https://github.com/radekvlk/LingoStacks/releases/latest/download/LingoStacks.apk"
             data-goatcounter-click="download-apk"
             data-cs="⬇️ Stáhnout LingoStacks (.apk)"
             data-en="⬇️ Download LingoStacks (.apk)"></a>
          <a class="btn btn-secondary" href="https://github.com/radekvlk/LingoStacks"
             data-cs="Zdrojový kód na GitHubu"
             data-en="View on GitHub"></a>
        </div>

        <div class="badges">
          <span class="pill">📱 Android 8.0+</span>
          <span class="pill" data-cs="🎙️ Rozpoznávání hlasu" data-en="🎙️ Speech Recognition"></span>
          <span class="pill" data-cs="📚 8 270+ slovíček &amp; frází" data-en="📚 8,270+ Words &amp; Phrases"></span>
          <span class="pill" data-cs="🔄 Obousměrně CZ ↔ EN/ES/DE/FR/IT" data-en="🔄 Bidirectional Practice"></span>
        </div>
      </div>

      <div class="qr-card">
        <img src="qr_download.png" alt="QR code to download LingoStacks APK" />
        <strong data-cs="Stáhnout do telefonu" data-en="Scan to Download"></strong>
        <small data-cs="Naskenujte QR kód foťákem a nainstalujte nejnovější APK."
               data-en="Point your phone camera to install the latest APK."></small>
      </div>
    </section>

    <h2 data-cs="Ukázky z aplikace" data-en="App Screenshots"></h2>
    <section class="shots">
      <div class="shot"><img src="screenshots/01_home.png" alt="LingoStacks Home" /></div>
      <div class="shot"><img src="screenshots/02_flashcard.png" alt="LingoStacks Voice Flashcard" /></div>
      <div class="shot"><img src="screenshots/03_flashcard_hint.png" alt="LingoStacks Hint & Pronunciation" /></div>
      <div class="shot"><img src="screenshots/04_settings.png" alt="LingoStacks Settings" /></div>
      <div class="shot"><img src="screenshots/05_stats.png" alt="LingoStacks Stats & Leaderboard" /></div>
    </section>

    <h2 data-cs="Proč LingoStacks" data-en="Why LingoStacks"></h2>
    <section class="grid">
      <div class="card">
        <h3 data-cs="🎙️ Mluvení v reálném čase" data-en="🎙️ Real-Time Voice Practice"></h3>
        <p data-cs="Vyslovte překlad nahlas — aplikace ho okamžitě vyhodnotí s fonetickou tolerancí, přehraje rodilou výslovnost a posune vás na další kartu."
           data-en="Speak the translation out loud — the app evaluates your answer with phonetic tolerance, plays native pronunciation, and advances automatically."></p>
      </div>
      <div class="card">
        <h3 data-cs="🧠 Chytré opakování (SRS)" data-en="🧠 Smart Spaced Repetition"></h3>
        <p data-cs="Těžší slovíčka se automaticky vrací v optimálních intervalech (zvlášť pro aktivní i pasivní směr učení), takže neztrácíte čas tím, co už umíte."
           data-en="Harder words automatically return at optimal intervals (separately for active and passive recall), so you focus only on what needs practice."></p>
      </div>
      <div class="card">
        <h3 data-cs="☁️ Záloha a žebříček" data-en="☁️ Cloud Backup &amp; Leaderboard"></h3>
        <p data-cs="Přihlaste se Google účtem pro automatickou zálohu pokroku mezi zařízeními a porovnání v denním i týdenním žebříčku."
           data-en="Sign in with Google to automatically sync your progress across devices and compete on the daily and weekly leaderboard."></p>
      </div>
    </section>

    <h2 data-cs="Jak aplikaci nainstalovat (30 sekund)" data-en="How to Install (30 seconds)"></h2>
    <section class="install-box">
      <ol>
        <li data-cs="Klepněte na <strong>Stáhnout LingoStacks (.apk)</strong> nebo naskenujte QR kód výše."
            data-en="Tap <strong>Download LingoStacks (.apk)</strong> or scan the QR code above."></li>
        <li data-cs="Otevřete stažený soubor a potvrďte instalaci aplikace."
            data-en="Open the downloaded APK file and confirm installation."></li>
        <li data-cs="Pokud Android zobrazí okno <em>Google Play Protect („Nebezpečná aplikace zablokována“)</em> — objevuje se automaticky u aplikací mimo Obchod Play — klepněte na <strong>Více informací → Přesto nainstalovat</strong>. Další aktualizace už probíhají automaticky přímo uvnitř aplikace."
            data-en="If Android shows a <em>Google Play Protect</em> prompt (standard for apps installed outside Google Play), tap <strong>More details → Install anyway</strong>. Future updates install seamlessly inside the app via GitHub OTA."></li>
      </ol>
    </section>

    <footer>
      © 2026 Radek Vlk • <a href="https://github.com/radekvlk/LingoStacks">GitHub</a> • <a href="https://github.com/radekvlk/LingoStacks/releases/latest">Releases</a>
    </footer>
  </div>

  <script>
    function setLang(lang) {
      document.documentElement.lang = lang;
      document.getElementById('btn-cs').classList.toggle('active', lang === 'cs');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      document.querySelectorAll('[data-cs][data-en]').forEach(el => {
        el.innerHTML = el.getAttribute('data-' + lang);
      });
    }
    const navLang = (navigator.language || 'en').toLowerCase();
    setLang(navLang.startsWith('cs') || navLang.startsWith('sk') ? 'cs' : 'en');
  </script>
  <script data-goatcounter="https://lingostacks.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</body>
</html>
