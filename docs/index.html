<head>

  <style>
    :root {
      --bg: #f3f5f9;
      --surface: rgba(255, 255, 255, 0.85);
      --border: rgba(255, 255, 255, 0.9);
      --shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
      --text: #111827;
      --muted: #4b5563;
      --blue: #0a84ff;
      --indigo: #5856d6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 10%, rgba(10, 132, 255, 0.14), transparent 38%),
        radial-gradient(circle at 85% 20%, rgba(88, 86, 214, 0.14), transparent 36%),
        var(--bg);
      line-height: 1.55;
    }
    .wrap {
      max-width: 1060px;
      margin: 0 auto;
      padding: 20px 20px 64px;
    }
    .topbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 14px;
    }
    .lang-switch {
      display: inline-flex;
      background: var(--surface);
      border: 1px solid rgba(17, 24, 39, 0.08);
      border-radius: 999px;
      padding: 4px;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.05);
    }
    .lang-btn {
      border: 0;
      background: transparent;
      padding: 6px 14px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      color: var(--muted);
      transition: all 0.15s ease;
    }
    .lang-btn.active {
      background: #fff;
      color: var(--text);
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
    }
    .hero {
      display: grid;
      grid-template-columns: 1.35fr 0.65fr;
      gap: 28px;
      align-items: center;
      background: var(--surface);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 36px;
      box-shadow: var(--shadow);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }
    .brand-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.15;
      letter-spacing: -0.03em;
    }
    .lead {
      margin: 0 0 24px;
      font-size: 17px;
      color: var(--muted);
    }
    .cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 22px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 16px;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary {
      color: #fff;
      background: linear-gradient(135deg, var(--blue), var(--indigo));
      box-shadow: 0 10px 24px rgba(10, 132, 255, 0.28);
    }
    .btn-secondary {
      color: var(--text);
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(17, 24, 39, 0.1);
    }
    .qr-card {
      text-align: center;
      background: #fff;
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 10px 26px rgba(15, 23, 42, 0.06);
      border: 1px solid rgba(17, 24, 39, 0.06);
    }
    .qr-card img {
      width: 168px;
      height: 168px;
      display: block;
      margin: 0 auto 10px;
    }
    .qr-card small {
      display: block;
      color: var(--muted);
      font-size: 13px;
    }
    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
    }
    .pill {
      font-size: 13px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(10, 132, 255, 0.09);
      color: #0b57d0;
    }
    h2 {
      margin: 44px 0 18px;
      font-size: 24px;
      letter-spacing: -0.02em;
    }
    .shots {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 14px;
    }
    .shot {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 8px;
      box-shadow: var(--shadow);
    }
    .shot img {
      width: 100%;
      border-radius: 14px;
      display: block;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 22px;
      box-shadow: var(--shadow);
    }
    .card h3 {
      margin: 0 0 8px;
      font-size: 17px;
    }
    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 14.5px;
    }
    .install-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 24px 28px;
      box-shadow: var(--shadow);
    }
    .install-box ol {
      margin: 10px 0 0;
      padding-left: 20px;
      color: var(--muted);
    }
    .install-box li { margin-bottom: 8px; }
    footer {
      margin-top: 48px;
      text-align: center;
      color: var(--muted);
      font-size: 13.5px;
    }
    footer a { color: var(--blue); text-decoration: none; }
    @media (max-width: 860px) {
      .hero { grid-template-columns: 1fr; padding: 24px; }
      .shots { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

    <div class="topbar">
      <div class="lang-switch" role="group" aria-label="Language switch">
        <button class="lang-btn" id="btn-cs" onclick="setLang('cs')">🇨🇿 Čeština</button>
        <button class="lang-btn" id="btn-en" onclick="setLang('en')">🇬🇧 English</button>
      </div>
    </div>

    <section class="hero">
      <div>
        <div class="brand">
          <svg width="42" height="42" viewBox="0 0 42 42" fill="none" aria-hidden="true">
            <rect x="4" y="6" width="22" height="30" rx="6" transform="rotate(-13 15 21)" fill="url(#g1)" opacity="0.45"/>
            <rect x="13" y="6" width="22" height="30" rx="6" transform="rotate(4 24 21)" fill="#FFFFFF" stroke="#007AFF" stroke-width="1.6"/>
            <path d="M24 14L25.8 19.2L31 21L25.8 22.8L24 28L22.2 22.8L17 21L22.2 19.2L24 14Z" fill="url(#g2)"/>
            <defs>
              <linearGradient id="g1" x1="4" y1="6" x2="26" y2="36" gradientUnits="userSpaceOnUse">
                <stop stop-color="#00B4FF"/>
                <stop offset="1" stop-color="#0066FF"/>
              </linearGradient>
              <linearGradient id="g2" x1="17" y1="14" x2="31" y2="28" gradientUnits="userSpaceOnUse">
                <stop stop-color="#007AFF"/>
                <stop offset="1" stop-color="#5856D6"/>
              </linearGradient>
            </defs>
          </svg>
          <span class="brand-title">LingoStacks</span>
        </div>

        <h1 data-cs="Učte se slovíčka nahlas,<br/>ne jen očima."
            data-en="Learn vocabulary out loud,<br/>not just with your eyes."></h1>

        <p class="lead"
           data-cs="Hlasové procvičování, plynulé swipe kartičky a chytré intervalové opakování (SRS) pro <strong>angličtinu, španělštinu, němčinu, francouzštinu, italštinu a portugalštinu</strong> s podporou <strong>libovolného rodného jazyka</strong>. Zdarma, bez reklam a s cloudovou zálohou přes Google účet."
           data-en="Voice-first practice, smooth swipe flashcards, and smart spaced repetition (SRS) for <strong>English, Spanish, German, French, Italian, and Portuguese</strong> with support for <strong>any native language</strong>. Free, ad-free, with automatic Google cloud backup."></p>

        <div class="cta-row">
          <a class="btn btn-primary" href="https://github.com/radekvlk/LingoStacks/releases/latest/download/LingoStacks.apk"
             data-goatcounter-click="download-apk"
             data-cs="⬇️ Stáhnout LingoStacks (.apk)"
             data-en="⬇️ Download LingoStacks (.apk)"></a>
          <a class="btn btn-secondary" href="https://github.com/radekvlk/LingoStacks"
             data-cs="Zdrojový kód na GitHubu"
             data-en="View on GitHub"></a>
          <a class="btn btn-secondary" href="https://apps.obtainium.imranr.dev/redirect?r=obtainium://app/%7B%22id%22%3A%22cz.slovickaspeak.app%22%2C%22url%22%3A%22https%3A%2F%2Fgithub.com%2Fradekvlk%2FLingoStacks%22%2C%22author%22%3A%22radekvlk%22%2C%22name%22%3A%22LingoStacks%22%7D"
             data-goatcounter-click="open-obtainium"
             data-cs="📦 Přidat do Obtainium"
             data-en="📦 Get on Obtainium"></a>
          <a class="btn btn-secondary" href="https://ko-fi.com/radekvlk" target="_blank" rel="noopener"
             data-goatcounter-click="open-kofi"
             data-cs="☕ Podpořit na Ko-fi"
             data-en="☕ Support on Ko-fi"></a>
        </div>

        <div class="badges">
          <span class="pill">📱 Android 8.0+ (API 26–36)</span>
          <span class="pill" data-cs="🎙️ Rozpoznávání hlasu" data-en="🎙️ Speech Recognition"></span>
          <span class="pill" data-cs="📚 9 980+ slovíček a frází (114 balíčků)" data-en="📚 9,980+ Words &amp; Phrases (114 Decks)"></span>
          <span class="pill" data-cs="🌍 30+ jazykových kombinací" data-en="🌍 30+ Language Combinations"></span>

      <div class="qr-card">

    <h2 data-cs="Ukázky z aplikace" data-en="App Screenshots"></h2>

    <h2 data-cs="Proč LingoStacks" data-en="Why LingoStacks"></h2>
    <section class="grid">
      <div class="card">
        <h3 data-cs="🎙️ Mluvení v reálném čase" data-en="🎙️ Real-Time Voice Practice"></h3>
        <p data-cs="Vyslovte překlad nahlas — aplikace ho okamžitě vyhodnotí s fonetickou tolerancí, přehraje autentickou rodilou výslovnost a plynule posune kartu."
           data-en="Speak the translation out loud — the app evaluates your answer with phonetic tolerance, plays native pronunciation, and advances automatically."></p>
      </div>
      <div class="card">
        <h3 data-cs="🧠 Chytré intervalové opakování (SRS)" data-en="🧠 Smart Spaced Repetition (SRS)"></h3>
        <p data-cs="Těžší slovíčka se automaticky vrací v optimálních intervalech (zvlášť pro aktivní mluvení i pasivní poslech), takže neztrácíte čas tím, co už bezpečně umíte."
           data-en="Challenging words automatically return at optimal intervals (separately for active speaking and passive recall), maximizing long-term memory retention."></p>
      </div>
      <div class="card">
        <h3 data-cs="🌍 Globální multijazyčná podpora" data-en="🌍 Global Multilingual Learning"></h3>
        <p data-cs="Aplikace není jen pro české uživatele. Zvolte si svůj rodný jazyk (čeština, angličtina, španělština, němčina, francouzština, italština, portugalština) a učte se jakýkoliv jiný cizí jazyk s automaticky lokalizovanými zadáními i rozpoznáváním řeči."
           data-en="Not limited to a single language pair! Select your native language (English, Spanish, German, French, Italian, Portuguese, or Czech) and study any target language with localized prompts and continuous speech recognition."></p>
      </div>
      <div class="card">
        <h3 data-cs="🔄 Obousměrný trénink &amp; Mix" data-en="🔄 Bidirectional Recall &amp; Mix"></h3>
        <p data-cs="Procvičujte aktivní vybavení (Rodný ➔ Cizí), pasivní porozumění (Cizí ➔ Rodný) s automatickým předčítáním výslovnosti, nebo dynamický Mix obou směrů."
           data-en="Master active recall (Native ➔ Target), listening comprehension (Target ➔ Native) with automated native playback, or a dynamic Mix of both directions."></p>
      </div>
      <div class="card">
        <h3 data-cs="☁️ Cloudová záloha &amp; Žebříček" data-en="☁️ Cloud Backup &amp; Leaderboards"></h3>
        <p data-cs="Přihlaste se Google účtem pro bezproblémovou synchronizaci postupu mezi všemi vašimi zařízeními a zdravé porovnání v denním i týdenním žebříčku komunity."
           data-en="Sign in with Google to effortlessly sync your study progress across all your devices and stay motivated on daily and weekly community leaderboards."></p>
      </div>
      <div class="card">
        <h3 data-cs="🚫 100% Zdarma &amp; Bez reklam" data-en="🚫 100% Free &amp; Ad-Free"></h3>
        <p data-cs="Žádné otravné reklamy, žádná placená předplatná. Čisté, elegantní Cupertino Glass rozhraní navržené pro maximální soustředění na učení."
           data-en="Zero ads, no paywalls, and no subscription traps. A clean, distraction-free Cupertino Glass interface built entirely for focused language learning."></p>
      </div>
    </section>

    <h2 data-cs="Dostupnost &amp; Instalace" data-en="Availability &amp; Installation"></h2>

      <ol>
        <li data-cs="<strong>Google Play:</strong> Verze 1.0.0 (API 36) je v procesu uzavřeného testování a brzy bude k dispozici přímo v obchodě Google Play."
            data-en="<strong>Google Play:</strong> Version 1.0.0 (targeting Android 16 / API 36) is currently in Closed Testing and will be available on Google Play."></li>
        <li data-cs="<strong>Přímé stažení (GitHub):</strong> Klepněte na <strong>Stáhnout LingoStacks (.apk)</strong> nebo naskenujte QR kód výše a nainstalujte aplikaci. Všechny budoucí aktualizace se stahují automaticky přímo v aplikaci (OTA)."

        <li data-cs="Pokud Android zobrazí hlášení <em>Google Play Protect („Nebezpečná aplikace zablokována“)</em> — objevuje se standardně u všech aplikací instalovaných mimo Obchod Play — klepněte na <strong>Více informací → Přesto nainstalovat</strong>. Celý zdrojový kód aplikace je veřejně auditovatelný na GitHubu."

    <footer>

    </footer>

  <script>
    function setLang(lang) {
      document.documentElement.lang = lang;
      document.getElementById('btn-cs').classList.toggle('active', lang === 'cs');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      document.querySelectorAll('[data-cs][data-en]').forEach(el => {
        el.innerHTML = el.getAttribute('data-' + lang);
      });
    }
    const navLang = (navigator.language || 'en').toLowerCase();
    setLang(navLang.startsWith('cs') || navLang.startsWith('sk') ? 'cs' : 'en');
  </script>
  <script data-goatcounter="https://lingostacks.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
